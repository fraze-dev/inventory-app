<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Restock — USF Inventory</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #006747; }
        nav { display: flex; flex-direction: column; width: 180px; gap: 10px; margin-top: 20px; }
        nav a { text-decoration: none; color: white; font-weight: bold; background-color: #006747;
            padding: 10px 16px; border-radius: 6px; }
        nav a:hover { background-color: #004d35; }
        form { margin-top: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        select, input[type=number] { width: 100%; padding: 8px; margin-top: 5px; }
        button { margin-top: 20px; padding: 10px 25px; background-color: #006747;
                 color: white; border: none; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #004d35; }
        .message { margin-top: 20px; padding: 10px; background-color: #e8f5e9; border-left: 4px solid #006747; }
    </style>
</head>
<body>
    <h1>USF Inventory System</h1>
    <div style="display: flex; gap: 30px; align-items: flex-start;">
    <nav>
        <a href="/">Inventory</a>
        <a href="/order">Place Order</a>
        <a href="/restock">Restock</a>
    </nav>
    <div style="flex: 1;">
    <h2>Restock Inventory</h2>
    {% if message %}
        <div class="message">{{ message }}</div>
    {% endif %}
    <form method="POST">
        <label for="product">Select Product:</label>
        <select name="product" id="product">
            {% for product in products %}
            <option value="{{ product.name }}">
                {{ product.name }} ({{ product.stock }} in stock)
            </option>
            {% endfor %}
        </select>
        <label for="quantity">Quantity to Add:</label>
        <input type="number" name="quantity" id="quantity" value="1" min="1">
        <button type="submit">Receive Shipment</button>
    </form>
    </div>
    </div>
</body>
</html>
