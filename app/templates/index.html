<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>USF Inventory System</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #006747; }
        nav { display: flex; flex-direction: column; width: 180px; gap: 10px; margin-top: 20px; }
        nav a { text-decoration: none; color: white; font-weight: bold; background-color: #006747;
            padding: 10px 16px; border-radius: 6px; }
        nav a:hover { background-color: #004d35; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #006747; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .low { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>USF Inventory System</h1>
    <div style="display: flex; gap: 30px; align-items: flex-start;">
        <nav>
            <a href="/">Inventory</a>
            <a href="/order">Place Order</a>
            <a href="/restock">Restock</a>
        </nav>
        <div style="flex: 1;">
            <h2>Current Inventory</h2>
            <table>
                <tr>
                    <th>Product</th>
                    <th>Stock</th>
                </tr>
                {% for product in products %}
                <tr>
                    <td>{{ product.name }}</td>
                    <td class="{{ 'low' if product.stock < 10 else '' }}">
                        {{ product.stock }}
                    </td>
                </tr>
                {% endfor %}
            </table>
        </div>
    </div>
</body>
</html>
